# Example cluster secret for registering a remote cluster with KRO
#
# This secret contains the kubeconfig needed to connect to a remote cluster.
# KRO discovers clusters by watching secrets with the label: kro.run/cluster=true
#
# To use this template:
# 1. Replace <base64-encoded-kubeconfig> with your actual kubeconfig
# 2. Update the secret name to match your cluster name
# 3. Apply to the namespace configured with --cluster-secrets-namespace (default: kro-system)
#
# Generating the kubeconfig:
#   kubectl config view --minify --raw --context=<your-context> | base64
#
# Or using a file:
#   base64 < /path/to/kubeconfig

apiVersion: v1
kind: Secret
metadata:
  name: remote-cluster
  namespace: kro-system
  labels:
    # This label is required for KRO to discover the cluster
    kro.run/cluster: "true"
  annotations:
    # Optional: Add descriptive annotations
    kro.run/cluster-description: "Remote production cluster"
type: Opaque
data:
  # The key must match --cluster-secrets-key (default: kubeconfig)
  kubeconfig: <base64-encoded-kubeconfig>

---
# Example using stringData (Kubernetes will base64 encode automatically)
# Useful for development/testing - DO NOT use in production with real credentials
apiVersion: v1
kind: Secret
metadata:
  name: dev-cluster
  namespace: kro-system
  labels:
    kro.run/cluster: "true"
type: Opaque
stringData:
  kubeconfig: |
    apiVersion: v1
    kind: Config
    current-context: dev-cluster
    clusters:
    - name: dev-cluster
      cluster:
        server: https://dev-cluster-api.example.com:6443
        certificate-authority-data: LS0tLS1CRUdJTi... # base64 CA cert
    contexts:
    - name: dev-cluster
      context:
        cluster: dev-cluster
        user: kro-admin
    users:
    - name: kro-admin
      user:
        # Option 1: Client certificate
        client-certificate-data: LS0tLS1CRUdJTi... # base64 client cert
        client-key-data: LS0tLS1CRUdJTi...         # base64 client key
        # Option 2: Bearer token (uncomment if using token auth)
        # token: <service-account-token>
