---
# Create a long-lived token for the service account
# Note: In Kubernetes 1.24+, tokens are not automatically created
# This creates a token that can be used in the kubeconfig
apiVersion: v1
kind: Secret
metadata:
  name: kro-token
  namespace: kro-system
  annotations:
    kubernetes.io/service-account.name: kro
type: kubernetes.io/service-account-token
