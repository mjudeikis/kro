# RBAC configuration for KRO on remote clusters
#
# Apply this to each remote cluster that KRO will manage.
# This creates the necessary service account and permissions.
#
# Usage:
#   kubectl --context=<remote-cluster> apply -f rbac-remote-cluster.yaml

---
apiVersion: v1
kind: Namespace
metadata:
  name: kro-system

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kro
  namespace: kro-system

---
# Option 1: Cluster Admin (full permissions)
# Use this for development/testing or when you need full control
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kro-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: kro
  namespace: kro-system

---
